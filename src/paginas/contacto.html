<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monster Shop - Contacto</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../estilos/style.css" />
  </head>
  <body>
    <header class="bg-dark text-white p-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h2 class="mb-0">Monster Shop</h2>

        <div>
          <button
            class="btn btn-light btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#login"
          >
            Iniciar sesión
          </button>

          <button
            class="btn btn-success btn-sm"
            data-bs-toggle="modal"
            data-bs-target="#registro"
          >
            Registrarse
          </button>
        </div>
      </div>
    </header>

    <main class="container mt-5">
      <h1 class="text-center mb-4">Contacto</h1>

      <div class="row justify-content-center">
        <div class="col-md-7">
          <form>
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control"
                placeholder="Escribe tu nombre"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input
                type="email"
                class="form-control"
                placeholder="Escribe tu correo"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Asunto</label>
              <input
                type="text"
                class="form-control"
                placeholder="Motivo del mensaje"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Mensaje</label>
              <textarea
                class="form-control"
                rows="5"
                placeholder="Escribe tu mensaje"
                required
              ></textarea>
            </div>

            <button type="submit" class="btn btn-success">
              Enviar mensaje
            </button>
          </form>
        </div>
      </div>
    </main>

    <div class="modal fade" id="login">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Iniciar sesión</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form>
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control mb-3" required />

              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control mb-3" required />

              <button type="submit" class="btn btn-success">Entrar</button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="registro">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5>Registrarse</h5>
            <button class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <form>
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control mb-3" required />

              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control mb-3" required />

              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control mb-3" required />

              <button type="submit" class="btn btn-success">
                Crear cuenta
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
